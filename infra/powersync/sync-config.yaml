# GENERATED FILE — do not hand-edit.
# Run `pnpm --filter @werf/sync generate:sync-rules` to regenerate from the Postgres schema and
# the TENANCY registry (packages/sync/scripts/derive-sync-streams.ts).
# test/sync-streams-freshness.spec.ts (in @werf/sync) fails the build if this drifts from what
# that derivation produces. See service.yaml's header for the storage/auth setup this config
# runs alongside, and packages/sync/src/sync-streams.ts's header for what was empirically
# confirmed against a real journeyapps/powersync-service:1.23.3 instance (2026-08-09) — IN
# (SELECT ...) subqueries validate including two-hop nesting, EXISTS and now() do not.
config:
  edition: 3

streams:
  animal_identifiers:
    query: |
      SELECT animal_id, applied_at, created_at, created_by, deleted_at, farm_id, id, is_primary, type, updated_at, updated_by, value FROM animal_identifiers
      WHERE farm_id IN (SELECT farm_id FROM farm_users WHERE user_id = auth.user_id() AND deleted_at IS NULL AND accepted_at IS NOT NULL)
    auto_subscribe: true
  animals:
    query: |
      SELECT acquired_at, attributes, brand_applied_at, brand_id, breed, created_at, created_by, dam_id, deleted_at, dob, dob_estimated, enterprise_id, farm_id, id, land_unit_id, mob_id, photo_key, sex, sire_id, source, species, status, status_at, updated_at, updated_by FROM animals
      WHERE farm_id IN (SELECT farm_id FROM farm_users WHERE user_id = auth.user_id() AND deleted_at IS NULL AND accepted_at IS NOT NULL)
    auto_subscribe: true
  attachments:
    query: |
      SELECT checksum, created_at, created_by, deleted_at, farm_id, id, mime_type, object_key, occurred_at, size_bytes, status, subject_id, subject_type, updated_at, updated_by FROM attachments
      WHERE farm_id IN (SELECT farm_id FROM farm_users WHERE user_id = auth.user_id() AND deleted_at IS NULL AND accepted_at IS NOT NULL)
    auto_subscribe: true
  branding_registers:
    query: |
      SELECT body_position, certificate_reference, created_at, created_by, deleted_at, farm_id, id, jurisdiction, mark, mark_type, registered_at, species, updated_at, updated_by FROM branding_registers
      WHERE farm_id IN (SELECT farm_id FROM farm_users WHERE user_id = auth.user_id() AND deleted_at IS NULL AND accepted_at IS NOT NULL)
    auto_subscribe: true
  businesses:
    query: |
      SELECT created_at, deleted_at, id, name, registration_number, updated_at, vat_number FROM businesses
      WHERE id IN (SELECT business_id FROM farms WHERE id IN (SELECT farm_id FROM farm_users WHERE user_id = auth.user_id() AND deleted_at IS NULL AND accepted_at IS NOT NULL))
    auto_subscribe: true
  enterprises:
    query: |
      SELECT active, created_at, deleted_at, farm_id, id, name, type, updated_at FROM enterprises
      WHERE farm_id IN (SELECT farm_id FROM farm_users WHERE user_id = auth.user_id() AND deleted_at IS NULL AND accepted_at IS NOT NULL)
    auto_subscribe: true
  events:
    query: |
      SELECT animal_id, batch_id, created_at, created_by, deleted_at, employee_id, enterprise_id, farm_id, id, land_unit_id, location_geojson, mob_id, notes, occurred_at, payload, synced_at, type, updated_at FROM events_default AS events
      WHERE farm_id = subscription.parameter('farm_id') AND substring(occurred_at, 1, 7) = subscription.parameter('month') AND farm_id IN (SELECT farm_id FROM farm_users WHERE user_id = auth.user_id() AND deleted_at IS NULL AND accepted_at IS NOT NULL)
    auto_subscribe: false
    accept_potentially_dangerous_queries: true
  farm_users:
    query: |
      SELECT accepted_at, created_at, deleted_at, expires_at, farm_id, id, invited_at, role, scope, updated_at, user_id FROM farm_users
      WHERE farm_id IN (SELECT farm_id FROM farm_users WHERE user_id = auth.user_id() AND deleted_at IS NULL AND accepted_at IS NOT NULL)
    auto_subscribe: true
  farms:
    query: |
      SELECT business_id, created_at, deleted_at, district, enterprise_types, event_retention_months, hectares, id, jurisdiction, name, province, timezone, updated_at FROM farms
      WHERE id IN (SELECT farm_id FROM farm_users WHERE user_id = auth.user_id() AND deleted_at IS NULL AND accepted_at IS NOT NULL)
    auto_subscribe: true
  land_units:
    query: |
      SELECT attributes, boundary_geojson, carrying_capacity_lsu, code, created_at, created_by, deleted_at, enterprise_id, farm_id, hectares, id, irrigation, kind, name, parent_id, soil_type, updated_at, updated_by FROM land_units
      WHERE farm_id IN (SELECT farm_id FROM farm_users WHERE user_id = auth.user_id() AND deleted_at IS NULL AND accepted_at IS NOT NULL)
    auto_subscribe: true
  mobs:
    query: |
      SELECT created_at, created_by, deleted_at, enterprise_id, farm_id, head_count, id, initial_head_count, land_unit_id, name, species, updated_at, updated_by FROM mobs
      WHERE farm_id IN (SELECT farm_id FROM farm_users WHERE user_id = auth.user_id() AND deleted_at IS NULL AND accepted_at IS NOT NULL)
    auto_subscribe: true
  regulatory_rates:
    query: |
      SELECT code, created_at, effective_from, effective_to, gazette_reference, id, jurisdiction, notes, unit, value FROM regulatory_rates
      WHERE jurisdiction IN (SELECT jurisdiction FROM farms WHERE id IN (SELECT farm_id FROM farm_users WHERE user_id = auth.user_id() AND deleted_at IS NULL AND accepted_at IS NOT NULL))
    auto_subscribe: true
  species_gestation:
    query: |
      SELECT created_at, gestation_days, id, source, species, updated_at FROM species_gestation
      WHERE 1 IN (SELECT 1 FROM farm_users WHERE user_id = auth.user_id() AND deleted_at IS NULL AND accepted_at IS NOT NULL)
    auto_subscribe: true
  theft_incident_animals:
    query: |
      SELECT animal_id, created_at, created_by, deleted_at, farm_id, id, incident_id, recovered_at, updated_at, updated_by FROM theft_incident_animals
      WHERE farm_id IN (SELECT farm_id FROM farm_users WHERE user_id = auth.user_id() AND deleted_at IS NULL AND accepted_at IS NOT NULL)
    auto_subscribe: true
  theft_incidents:
    query: |
      SELECT case_number, created_at, created_by, deleted_at, discovered_at, evidence_pack_key, farm_id, head_count, id, land_unit_id, last_seen_at, last_seen_location_geojson, observations, reporting_station, status, updated_at, updated_by FROM theft_incidents
      WHERE farm_id IN (SELECT farm_id FROM farm_users WHERE user_id = auth.user_id() AND deleted_at IS NULL AND accepted_at IS NOT NULL)
    auto_subscribe: true
  users:
    query: |
      SELECT created_at, deleted_at, email, full_name, id, last_seen_at, locale, phone, theme, updated_at FROM users
      WHERE id = auth.user_id() OR id IN (SELECT user_id FROM farm_users WHERE deleted_at IS NULL AND accepted_at IS NOT NULL AND farm_id IN (SELECT farm_id FROM farm_users WHERE user_id = auth.user_id() AND deleted_at IS NULL AND accepted_at IS NOT NULL))
    auto_subscribe: true
  veterinary_products:
    query: |
      SELECT active_ingredients, created_at, dose_per_kg, effective_from, effective_to, id, jurisdiction, meat_withdrawal_days, milk_withdrawal_hours, name, registration_number, route, species, version FROM veterinary_products
      WHERE jurisdiction IN (SELECT jurisdiction FROM farms WHERE id IN (SELECT farm_id FROM farm_users WHERE user_id = auth.user_id() AND deleted_at IS NULL AND accepted_at IS NOT NULL))
    auto_subscribe: true
