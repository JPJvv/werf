name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege. gitleaks-action reads the PR's commit list on pull_request
# events, which needs pull-requests:read on top of the default contents:read.
permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: gitleaks scans the whole commit range on a PR, which
          # a shallow (depth-1) clone can't walk — the base commit is missing
          # and the underlying git log fails with "stderr is not empty".
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # pnpm 11 (pinned via packageManager) requires Node >= 22.13.
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # THE GATE — must exit 0. Mirrors `pnpm verify` locally.
      - name: Verify
        run: pnpm verify

  e2e:
    name: E2E · axe (both themes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Chromium only. The accessibility rules being asserted are engine-independent, and
      # a second browser doubles the lane's cost to re-answer the same question.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      # NFR-401: axe-core, zero violations, in BOTH themes. Its own lane rather than part
      # of `pnpm verify` because it needs a browser and a built, served app — keeping the
      # inner loop fast is what stops people skipping the gate.
      - name: E2E and accessibility
        run: pnpm test:e2e

      # A red run with no trace is a red run diagnosed by guesswork (playwright.config.ts's own
      # A8/A9 lesson). `retain-on-failure` already writes the trace/screenshot locally; nothing
      # was ever uploading them off the runner, so every CI-only failure had to be reproduced
      # blind. Failure-only and 7-day retention: this is a debugging aid, not an audit trail.
      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  dependency-audit:
    name: Dependency audit (NFR-208)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # NFR-208 as written: "no known critical CVE in production". --prod scopes to production
      # dependencies only — a devDependency-only vulnerability (e.g. one reachable solely through
      # a local dev-server tool nobody runs in production) is a real finding worth tracking, but
      # it is not what this gate promises, and failing the build on it would make the gate lie in
      # the other direction the day someone "fixes" it by suppressing a true production alert to
      # get back to green.
      - name: Audit production dependencies
        run: pnpm audit --audit-level=critical --prod
