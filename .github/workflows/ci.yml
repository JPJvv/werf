name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege. gitleaks-action reads the PR's commit list on pull_request
# events, which needs pull-requests:read on top of the default contents:read.
permissions:
  contents: read
  pull-requests: read

# Cancel superseded runs on the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # THE GATE — must exit 0. Mirrors `pnpm verify` locally.
      - name: Verify
        run: pnpm verify
