# Self-hosted PowerSync service config — LOCAL DEV ONLY. Shape confirmed against
# docs.powersync.com/tools/local-development (verbatim-quoted, not paraphrased). Production
# config (af-south-1, real secrets) is not this file — see ADR-0011 for the auth boundary and
# the ⛔ known-gaps note in sync-config.yaml before treating this as deployable.
#
# Reuses the SAME Postgres server (`postgres`, this repo's docker-compose.yml) for both the
# replication source (the `werf` app database) and PowerSync's own bucket storage (a SEPARATE
# database, `werf_powersync_storage` — no schema-selection key is documented for the storage
# URI, so a second database is the unambiguous choice; see infra/postgres/init-powersync-storage.sql).
# Confirmed workable for Postgres 14+ sharing a server between the two roles.

replication:
  connections:
    - type: postgresql
      uri: postgresql://werf:werf@postgres:5432/werf
      sslmode: disable

storage:
  type: postgresql
  uri: postgresql://werf:werf@postgres:5432/werf_powersync_storage
  sslmode: disable

port: 8080

sync_config:
  path: sync-config.yaml

client_auth:
  # No Supabase Auth in this product (ADR-0002/self-hosted af-south-1). A dev-only RS256 keypair
  # signs the token used to exercise .connect() locally; the PRIVATE key is never committed. The
  # local bootstrap derives this public modulus into the git-ignored `.env`, and Compose injects
  # it through PowerSync's supported `!env` scalar. Production key custody is ADR-0011 / task 4
  # territory, not decided here.
  jwks:
    keys:
      - kty: 'RSA'
        n: !env PS_JWKS_N
        e: 'AQAB'
        alg: 'RS256'
        kid: 'werf-dev-1'
  audience: ['werf-dev']
